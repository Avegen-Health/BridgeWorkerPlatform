dev.addf.exportstore.bucket=org-gvbridge-addf-exportstore-dev
uat.addf.exportstore.bucket=org-gvbridge-addf-exportstore-uat
prod.addf.exportstore.bucket=org-gvbridge-addf-exportstore-prod

# ADDF Export - Azure staging container.
# Non-secret container URL + SAS token/expiry. In dev/uat/prod these are
# OVERRIDDEN at runtime by EB environment properties sourced from SSM at deploy
# (see BridgeWorkerPlatform-infra bridgeworker.yaml: AddfBlobSasToken =
# !ssm /bridgeworker-<env>/AddfBlobSasToken). Leave the token blank here; set the
# real value in SSM Parameter Store via the AWS console, never in this file.
addf.azure.container.url=PLACEHOLDER_BLOCKED_ON_ADDI
addf.azure.sas.token=
addf.azure.sas.expiry=1970-01-01

# ADDF Export - kill switches (default off; flipped per env at rollout)
addf.export.enabled=false
addf.publish.enabled=false

# ADDF Export - export test_user participants (non-prod only).
# Default false = the strict §3.2 rule: test users are gated out of delivery.
# In uat/dev every account is conventionally a test_user, so a strict gate makes
# end-to-end validation impossible; opting in there lets the pipeline be exercised.
# Exported rows still carry is_test=true on every table so they can be filtered
# downstream. This NEVER relaxes the NO_SHARING consent check.
# Must remain false in prod - test data must not reach AD Workbench.
addf.export.include.test.users=false
local.addf.export.include.test.users=true
dev.addf.export.include.test.users=true
uat.addf.export.include.test.users=true
prod.addf.export.include.test.users=false

# ADDF Export - manifest gate (Phase 7 §7). Default ON: a snapshot missing a
# table, breaking a column contract, or carrying an orphan participant_version FK
# is BLOCKED before anything reaches ADDI. Set false only to deliver a knowingly
# incomplete snapshot -- the gate still runs and still logs every violation at
# ERROR, it just stops throwing.
addf.publish.gate.enforced=true
