prod.addf.exportstore.bucket=org-gvbridge-addf-exportstore-prod

# ADDF Export - Azure staging container.
# Non-secret container URL + SAS token/expiry. In dev/uat/prod these are
# OVERRIDDEN at runtime by EB environment properties sourced from SSM at deploy
# (see BridgeWorkerPlatform-infra bridgeworker.yaml: AddfBlobSasToken =
# !ssm /bridgeworker-<env>/AddfBlobSasToken). Leave the token blank here; set the
# real value in SSM Parameter Store via the AWS console, never in this file.
addf.azure.container.url=PLACEHOLDER_BLOCKED_ON_ADDI
addf.azure.sas.token=
addf.azure.sas.expiry=1970-01-01

# ADDF Export - kill switches (default off; flipped per env at rollout)
addf.export.enabled=false
addf.publish.enabled=false

# ADDF Export - raw archive delivery (the delivery tree's second layer).
# Separate from addf.publish.enabled on purpose: raw payloads are megabytes where the
# consolidated tables are kilobytes, and they are the most PII-dense artefact we ship.
# Without its own gate the only way to stop raw delivery mid-incident is to disable the
# whole publish, which also halts the table delivery the partner already depends on.
# Opted into per env once the table layer is confirmed healthy.
addf.publish.raw.enabled=false
local.addf.publish.raw.enabled=true
dev.addf.publish.raw.enabled=true
uat.addf.publish.raw.enabled=true
prod.addf.publish.raw.enabled=false

# ADDF Export - max raw archives delivered per publish run.
# Bounds one run's wall clock so it stays well inside the publish lease TTL and the request
# queue's visibility timeout. Anything over the cap is parked in _pending_raw/ and picked up
# on the next run - never silently dropped. Steady-state inflow is far below this; the cap
# only binds while draining a seeded historical backlog, where it is the throttle.
addf.publish.raw.max.per.run=500

# ADDF Export - export test_user participants (non-prod only).
# Default false = the strict §3.2 rule: test users are gated out of delivery.
# In uat/dev every account is conventionally a test_user, so a strict gate makes
# end-to-end validation impossible; opting in there lets the pipeline be exercised.
# Exported rows still carry is_test=true on every table so they can be filtered
# downstream. This NEVER relaxes the NO_SHARING consent check.
# Must remain false in prod - test data must not reach AD Workbench.
addf.export.include.test.users=false
local.addf.export.include.test.users=true
dev.addf.export.include.test.users=true
uat.addf.export.include.test.users=true
prod.addf.export.include.test.users=false

# ADDF Export - manifest gate (Phase 7 §7). Default ON: a snapshot missing a
# table, breaking a column contract, or carrying an orphan participant_version FK
# is BLOCKED before anything reaches ADDI. Set false only to deliver a knowingly
# incomplete snapshot -- the gate still runs and still logs every violation at
# ERROR, it just stops throwing.
addf.publish.gate.enforced=true
# uat is deliberately NOT enforcing yet -- but no longer for the original reason.
# The blocker this flag was added for (the 3b.4 participant-version backfill never
# having run, leaving one participant with a dimension row and most activity
# records orphan-deferred) was cleared when the backfill ran on 2026-09-24.
#
# It stays false now for a narrower reason: the gate has not yet been OBSERVED
# passing on a post-backfill snapshot. Enforcing a gate that has never been seen
# to pass converts an unknown into an outage. Unenforced, it still runs and still
# reports every violation at ERROR, which is exactly the diagnostic needed to
# decide whether it is safe to arm.
#
# Flip to true once BOTH hold:
#   1. A publish has run since the backfill drained and the gate logged
#      "ADDF manifest gate passed" -- i.e. all 10 tables present, every delta file
#      matching its column contract, no orphan FKs.
#   2. The uat publish schedule is back on the daily cron. It is currently on a
#      temporary rate(5 minutes) (PublishScheduleExpression in BWP-infra
#      config/uat/addf-export.yaml, marked TEMPORARY and not yet reverted).
#      This matters: the publish message rides Bridge-WorkerPlatform-Request-staging,
#      the GENERAL worker queue, which has no DLQ. An enforced gate on a blocked
#      snapshot throws on every tick, so a 5-minute schedule means ~288 failing
#      messages a day cycling for up to 4 days instead of 1.
#
# Note keyboard_sessions moved under current/tables/ in this branch. Parts written
# before the move remain at the old delivery-root path and are NOT counted by
# ExportStoreClient.listKeyboardParts(), so the gate sees the table as present only
# once a publish has written a new part. Do not arm the gate on a day with no
# keyboard staging data.
uat.addf.publish.gate.enforced=false
