  provider: elasticbeanstalk
  edge: true
  access_key_id:
    develop: AKIAJQOD25TNB4GR4LFQ
    uat: AKIAWKBC6B4EQLJ6KI6U
    prod: AKIATMSHFP3OEFUATAP7
  secret_access_key:
    develop:
      secure: ""
    uat:
      secure: ""
    prod:
      secure: ""
  region: us-east-1
  app: bridgeworker-$TRAVIS_BRANCH-application
  env: bridgeworker-$TRAVIS_BRANCH
  bucket:
    develop: elasticbeanstalk-us-east-1-420786776710
    uat: elasticbeanstalk-us-east-1-433864969993
    prod: elasticbeanstalk-us-east-1-233151233756
  zip-file: eb-bundle.zip
  on:
    branch:
    - uat
    - prod
